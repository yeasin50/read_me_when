name: read_me_when
description: "Quranic verses (ayah) based on mood."
publish_to: https://yeasin50.github.io/read_me_when/
version: 0.1.1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  equatable: ^2.0.5
  go_router: ^17.2.0
  google_fonts: ^8.0.2
  collection: ^1.18.0
  font_awesome_flutter: ^11.0.0
  shared_preferences: ^2.3.3
  flutter_animate: ^4.5.2
  share_plus: ^12.0.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  file_picker: ^11.0.1

  verse_share:
    path: ./packages/verse_share

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/share_bg_img/
